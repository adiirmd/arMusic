name: Build & release Android

# Rilis dibuat saat tag versi didorong, misalnya: git tag v1.0.0 && git push origin v1.0.0
# Bisa juga dijalankan manual dari tab Actions untuk sekadar mengetes build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versi rilis, misal 1.0.0. Kosongkan untuk build uji tanpa membuat rilis."
        required: false
        default: ""

permissions:
  contents: write        # dibutuhkan hanya untuk membuat Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Paket bawaan action ini menyertakan 'tools' yang sudah dihapus
          # Google, dan sdkmanager gagal karenanya. Sebut paketnya sendiri
          # sekalian supaya versinya pasti, bukan ikut isi image runner.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Siapkan keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            {
              echo "path=$KS"
              echo "pw=$KEYSTORE_PW"
              echo "alias=$KEY_ALIAS"
              echo "keypw=$KEY_PW"
              echo "stable=true"
            } >> "$GITHUB_OUTPUT"
            echo "Memakai keystore tetap dari secret repo."
          else
            # Tidak ada secret: buat kunci sekali pakai supaya tetap ada APK
            # yang bisa dipasang. Rilisnya ditandai prerelease, karena kunci
            # sekali pakai berarti pembaruan berikutnya tidak bisa menimpa.
            PW="$(head -c 24 /dev/urandom | base64 | tr -d '/+=' )"
            keytool -genkeypair -v -keystore "$KS" -alias armusic \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$PW" -keypass "$PW" \
              -dname "CN=AR Music, O=AR Music, C=ID" >/dev/null
            {
              echo "path=$KS"
              echo "pw=$PW"
              echo "alias=armusic"
              echo "keypw=$PW"
              echo "stable=false"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::Secret penandatanganan belum disetel, dipakai kunci sekali pakai. Rilis ditandai prerelease."
          fi

      - name: Build release APK + AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.pw }}
          ANDROID_KEY_ALIAS: ${{ steps.keystore.outputs.alias }}
          ANDROID_KEY_PASSWORD: ${{ steps.keystore.outputs.keypw }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Pastikan APK benar-benar tertandatangani
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs "$APK"
          # v2/v3 adalah yang dilihat Play Protect; tanpa itu build dianggap gagal
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --min-sdk-version 24 "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Ringkas isi manifest untuk dibaca di log
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK_PATH" \
            | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label)" || true

      - name: Beri nama berkas sesuai versi
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ]; then
            VER="${GITHUB_REF_NAME#v}"
            [ "$VER" = "$GITHUB_REF_NAME" ] && VER="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p out
          cp "$APK_PATH" "out/ARMusic-${VER}.apk"
          cp app/build/outputs/bundle/release/*.aab "out/ARMusic-${VER}.aab"
          ( cd out && sha256sum *.apk *.aab > SHA256SUMS.txt )
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: armusic-android
          path: android/out/*

      - name: Publikasikan Release
        # Tag bisa datang dari push tag, atau dibuat langsung oleh action ini
        # saat dijalankan manual dengan input versi.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          files: |
            android/out/*.apk
            android/out/*.aab
            android/out/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ steps.keystore.outputs.stable != 'true' }}
          body: |
            Aplikasi Android AR Music.

            Pasang berkas `.apk`. Berkas `.aab` hanya diperlukan kalau nanti
            diunggah ke Google Play. Cocokkan `SHA256SUMS.txt` sebelum memasang
            kalau berkas ini diteruskan ke orang lain.

            Saat memasang di luar Play Store, Android menampilkan konfirmasi
            sumber tidak dikenal. Itu perilaku normal untuk semua APK yang
            dipasang manual, bukan tanda aplikasinya bermasalah.

            ${{ steps.keystore.outputs.stable == 'true' && '' || '**Ditandai prerelease.** Build ini ditandatangani dengan kunci sekali pakai karena secret penandatanganan belum disetel di repo. APK-nya berjalan normal, tapi versi berikutnya tidak akan bisa dipasang menimpa yang ini — harus dicopot dulu. Untuk kunci tetap, ikuti android/README.md lalu buat tag baru.' }}
