name: Build & release Android

# Rilis dibuat saat tag versi didorong, misalnya: git tag v1.0.0 && git push origin v1.0.0
# Bisa juga dijalankan manual dari tab Actions untuk sekadar mengetes build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # dibutuhkan hanya untuk membuat Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Pulihkan keystore dari secret
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 belum diisi." >&2
            echo "Tanpa itu APK tidak bisa ditandatangani dan tidak akan bisa dipasang." >&2
            echo "Lihat android/README.md untuk cara membuat dan mengunggahnya." >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK + AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Pastikan APK benar-benar tertandatangani
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs "$APK"
          # v2/v3 adalah yang dilihat Play Protect; tanpa itu build dianggap gagal
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --min-sdk-version 24 "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Ringkas isi manifest untuk dibaca di log
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK_PATH" \
            | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label)" || true

      - name: Beri nama berkas sesuai versi
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$VER" = "$GITHUB_REF_NAME" ] && VER="dev-${GITHUB_SHA::7}"
          mkdir -p out
          cp "$APK_PATH" "out/ARMusic-${VER}.apk"
          cp app/build/outputs/bundle/release/*.aab "out/ARMusic-${VER}.aab"
          ( cd out && sha256sum *.apk *.aab > SHA256SUMS.txt )
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: armusic-android
          path: android/out/*

      - name: Publikasikan Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/out/*.apk
            android/out/*.aab
            android/out/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Aplikasi Android AR Music.

            Pasang berkas `.apk`. Berkas `.aab` hanya diperlukan kalau nanti
            diunggah ke Google Play.

            Cocokkan `SHA256SUMS.txt` sebelum memasang kalau berkas ini
            diteruskan ke orang lain.

            Saat memasang di luar Play Store, Android akan menampilkan
            konfirmasi sumber tidak dikenal. Itu perilaku normal untuk semua
            APK yang dipasang manual, bukan tanda aplikasinya bermasalah.
